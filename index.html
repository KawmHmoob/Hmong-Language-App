<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawm Hmoob — Learn Hmong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nunito      = display face (Hmong text + headings) — rounded, warm.
         Nunito Sans = UI face (body) — same superfamily, quieter.
         No serif anywhere: serif display reads as "AI product" right now.
         To swap fonts you touch 3 places: this link, tailwind.config.js
         fontFamily, and the two @layer base rules in src/index.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Set the theme BEFORE React mounts so there's no flash of the wrong
         theme. Dark is the primary theme; a saved choice wins. Themes:
         light | dark | neon (neon = dark class + data-theme attribute). -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('kawmhmoob.theme') || 'dark'
        } catch (e) { /* private mode etc. — fall through to dark */ }
        if (theme !== 'light') document.documentElement.classList.add('dark')
        if (theme === 'neon') document.documentElement.setAttribute('data-theme', 'neon')
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
